services:
  - type: web
    name: gpi-api
    runtime: node
    rootDir: api
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /api
    disk:
      name: uploaded-documents
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gpi-database
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_SECRET
        generateValue: true
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false

databases:
  - name: gpi-database
    databaseName: plateforme_etudiante
    user: gpi_app
    region: frankfurt
    plan: basic-1gb
